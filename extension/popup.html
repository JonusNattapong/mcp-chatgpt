<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #fdfdfd;
      color: #333;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-connected {
      background: #e6f7ef;
      color: #10a37f;
    }
    .status-disconnected {
      background: #fbeae9;
      color: #d93025;
    }
    .field {
      margin-top: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      background: #10a37f;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button.secondary {
      background: #ececf1;
      color: #333;
    }
    .tip-box {
      font-size: 11px;
      color: #666;
      margin-top: 12px;
      padding: 8px 10px;
      background: #f4f4f7;
      border-radius: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>
    🤖 MCP ChatGPT Bridge
  </h3>

  <div>
    <span>Status: </span>
    <span id="statusBadge" class="status-badge status-disconnected">Disconnected</span>
  </div>

  <div class="field">
    <label for="profileName">Profile / Account Tag:</label>
    <input type="text" id="profileName" placeholder="e.g. Work Profile / Personal">
  </div>

  <button id="saveBtn">Save & Connect</button>
  <button id="openTabBtn" class="secondary">Open ChatGPT Web</button>

  <div id="tipBox" class="tip-box">
    💡 <b>Note:</b> Make sure MCP Server is running (via Antigravity / Claude Desktop or <code>npm run bridge</code> in terminal) on port 18999.
  </div>

  <script src="popup.js"></script>
</body>
</html>
